<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Roggy Buy List</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"><link rel="apple-touch-icon" href="icon.svg"></head>
<body><header><div><h1>Buy List</h1><p>Needs first. Luxuries later.</p></div><button id="refreshBtn" class="icon-btn" aria-label="Refresh">↻</button></header>
<nav class="page-tabs"><button id="activeTab" class="page-tab active">Buy List</button><button id="groceryTab" class="page-tab">Groceries</button><button id="deletedTab" class="page-tab">Recently Deleted <span id="deletedCount"></span></button></nav><main><section id="summary" class="summary"></section><section class="toolbar"><div class="segmented"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="Need">Need</button><button class="filter" data-filter="Want">Want</button><button class="filter" data-filter="Eventually">Eventually</button></div><div class="searchrow"><input id="search" placeholder="Search items..." autocomplete="off"><select id="sort" aria-label="Sort"><option value="priority">Priority</option><option value="price">Lowest option</option><option value="name">A–Z</option></select></div></section><section id="status" class="status"></section><section id="list" class="list"></section></main>
<button id="addBtn" class="fab">＋</button>
<dialog id="itemDialog"><form method="dialog" id="itemForm"><div class="dialog-head"><h2 id="dialogTitle">Add item</h2><button value="cancel" class="plain">✕</button></div><input type="hidden" id="rowIndex"><label>Item<input id="item" required></label><div class="grid2"><label>Category<select id="category"><option>Home</option><option>Office</option><option>Groceries</option><option>Decoration</option><option>Tech</option><option>Clothing</option><option>Outdoor</option><option>Other</option></select></label><label>Priority<select id="priority"><option>Need</option><option>Want</option><option>Eventually</option></select></label></div><div class="grid2"><label>Target price<input id="targetPrice" inputmode="decimal" placeholder="$"></label><label>Status<select id="itemStatus"><option>Looking</option><option>Ready to Buy</option><option>Bought</option></select></label></div><label>Notes<textarea id="notes" rows="3"></textarea></label><div class="actions"><button value="cancel" class="secondary">Cancel</button><button id="saveBtn" value="default" class="primary">Save</button></div></form></dialog><script src="app.js"></script></body></html>
