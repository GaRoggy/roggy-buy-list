<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Roggy Lists</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"><link rel="apple-touch-icon" href="icon.svg"></head><body>
<header><div><h1 id="pageTitle">Buy List</h1><p id="pageSubtitle">Needs first. Luxuries later.</p></div><button id="backupBtn" class="icon-btn" aria-label="Backup">⇩</button></header>
<nav class="page-tabs"><button class="page-tab active" data-list="buy">Buy List</button><button class="page-tab" data-list="groceries">Groceries</button></nav>
<nav class="sub-tabs"><button class="sub-tab active" data-view="active">Active</button><button class="sub-tab" data-view="deleted">Recently Deleted <span id="deletedCount"></span></button></nav>
<main><section id="summary" class="summary"></section><section class="toolbar"><div id="priorityFilters" class="segmented"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="Need">Need</button><button class="filter" data-filter="Want">Want</button><button class="filter" data-filter="Eventually">Eventually</button></div><div class="searchrow"><input id="search" placeholder="Search items..." autocomplete="off"><select id="sort"><option value="priority">Priority</option><option value="name">A–Z</option></select></div></section><section id="status" class="status"></section><section id="list" class="list"></section></main>
<button id="addBtn" class="fab">＋</button>
<dialog id="itemDialog"><form method="dialog" id="itemForm"><div class="dialog-head"><h2 id="dialogTitle">Add item</h2><button value="cancel" class="plain">✕</button></div><input type="hidden" id="itemId"><label>Item<input id="item" required></label><div class="grid2"><label>Category<input id="category" placeholder="Home, Kitchen, Produce..."></label><label>Priority<select id="priority"><option>Need</option><option>Want</option><option>Eventually</option></select></label></div><div class="grid2"><label>Quantity<input id="quantity" placeholder="1"></label><label>Status<select id="itemStatus"><option>Looking</option><option>Ready to Buy</option><option>Bought</option></select></label></div><label>Notes<textarea id="notes" rows="3"></textarea></label><div class="actions"><button value="cancel" class="secondary">Cancel</button><button id="saveBtn" value="default" class="primary">Save</button></div></form></dialog>
<input id="importFile" type="file" accept="application/json" hidden><script src="app.js"></script></body></html>
